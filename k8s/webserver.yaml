apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: insult
  labels:
    app: web-server
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
        - name: web-server
          image: ghcr.io/biffsocko/webserver:v2
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: insult
spec:
  selector:
    app: web-server
  ports:
    - port: 80
      targetPort: 80
